```svg
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1F1F1F"/>
      <stop offset="1" stop-color="#2E1065"/>
    </linearGradient>

    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="240" fill="url(#bg)"/>

  <!-- Calculator Body -->
  <g filter="url(#shadow)">
    <rect x="252" y="160" width="520" height="704" rx="64" fill="#0F0F10"/>

    <!-- Screen -->
    <rect x="304" y="220" width="416" height="140" rx="32" fill="url(#screen)" stroke="#A855F7" stroke-width="4"/>

    <!-- Display Text -->
    <text x="660" y="315" text-anchor="end" fill="#E9D5FF" font-size="80" font-family="Arial, sans-serif" font-weight="700">
      12+7
    </text>

    <!-- Buttons -->
    <g>
      <!-- Row 1 -->
      <circle cx="372" cy="470" r="42" fill="#1F1F22"/>
      <circle cx="512" cy="470" r="42" fill="#1F1F22"/>
      <circle cx="652" cy="470" r="42" fill="#7C3AED"/>

      <!-- Row 2 -->
      <circle cx="372" cy="610" r="42" fill="#1F1F22"/>
      <circle cx="512" cy="610" r="42" fill="#1F1F22"/>
      <circle cx="652" cy="610" r="42" fill="#7C3AED"/>

      <!-- Row 3 -->
      <circle cx="372" cy="750" r="42" fill="#1F1F22"/>
      <circle cx="512" cy="750" r="42" fill="#1F1F22"/>
      <circle cx="652" cy="750" r="42" fill="#A855F7"/>
    </g>

    <!-- Symbols -->
    <g fill="#FFFFFF" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">
      <text x="372" y="485">7</text>
      <text x="512" y="485">8</text>
      <text x="652" y="485">+</text>

      <text x="372" y="625">4</text>
      <text x="512" y="625">5</text>
      <text x="652" y="625">−</text>

      <text x="372" y="765">1</text>
      <text x="512" y="765">2</text>
      <text x="652" y="765">=</text>
    </g>
  </g>
</svg>
```

Is file ko `.svg` name se save kar dein, for example:

`calculator-icon.svg`

Ye vector SVG icon hai jo normally PWABuilder aur PWA manifest systems easily accept karte hain. SVG hone ki wajah se quality blur bhi nahi hogi.
